services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8501:8501"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env
    volumes:
      - ./data:/app/data:Z
      - sqlite-data:/app/data/sqlite
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
  sqlite-data:
